# ============================================================
# Shadowrocket 通用抓包 · 规则表
# ============================================================
# 这个文件是纯配置，不含任何密钥，可以放心公开。
# 改完直接推 GitHub，手机端自动同步（模块缓存 10 分钟）。
#
# 字段说明：
#   name       唯一标识（冷却/去重按它记，别重复）
#   enable     true 启用 / false 停用
#   host       域名（URL 包含即命中）；也可写 /正则/
#   pathRegex  可选，路径再筛一道
#   source     抓哪儿，见下表
#   headerKey  source 是 *.header 时，指定头名
#   valueRegex 提取正则，默认取第 1 个捕获组
#   group      可选，指定取第几个捕获组；0 = 取整段
#   label      弹窗里显示的名字
#
# source 取值：
#   request.cookie    请求头 Cookie
#   request.header    请求头某一项（配 headerKey）
#   request.body      请求体
#   response.cookie   响应 Set-Cookie
#   response.header   响应头某一项（配 headerKey）
#   response.body     响应体
# ============================================================


# ───────────── 饿了么 / 淘宝闪购 ─────────────
# 抓 H5 端完整 Cookie。注意要抓 tb.ele.me / waimai-guide.ele.me，
# App 的 Cookie 在 H5 路由下不认。
[[rule]]
name    = "elm-cookie"
enable  = true
host    = "waimai-guide.ele.me"
source  = "request.cookie"
valueRegex = '(cookie2=[^;]+(?:; )[^;]+; SID=[^;]+; USERID=[^;]+; UTUSER=[^;]+; munb=[^;]+; unb=[^;]+)'
label   = "饿了么Cookie"

# ───────────── 中国移动 ─────────────
# 抓 APP 的 autoLogin 请求体（含 xk / 设备指纹），用于工作台导入
[[rule]]
name    = "cmcc-autologin"
enable  = false
host    = "client.app.coc.10086.cn"
pathRegex = "uam(onekey|randcode)login/autoLogin"
source  = "request.body"
valueRegex = '^(.+)$'
group   = 1
label   = "移动autoLogin请求体"

[[rule]]
name    = "cmcc-cookie"
enable  = false
host    = "wx.10086.cn"
source  = "request.cookie"
valueRegex = '(JSESSIONID=[^;]+; UID=[^;]*[^;\s]*)'
label   = "移动Cookie"

# ───────────── 京东 ─────────────
[[rule]]
name    = "jd-ptkey"
enable  = false
host    = "jd.com"
source  = "request.cookie"
valueRegex = '(pt_key=[^;]+; pt_pin=[^;]+)'
label   = "京东Cookie"

# ───────────── 美团 ─────────────
[[rule]]
name    = "meituan-token"
enable  = false
host    = "meituan.com"
source  = "request.header"
headerKey = "token"
valueRegex = '^(.+)$'
label   = "美团Token"

# ───────────── 通用示例：抓 Bearer Token ─────────────
[[rule]]
name    = "generic-bearer"
enable  = false
host    = "example.com"
source  = "request.header"
headerKey = "Authorization"
valueRegex = 'Bearer\s+(\S+)'
label   = "Bearer Token"

# ───────────── 通用示例：抓响应体里的 token 字段 ─────────────
[[rule]]
name    = "generic-json-token"
enable  = false
host    = "example.com"
source  = "response.body"
valueRegex = '"token"\s*:\s*"([^"]+)"'
label   = "接口Token"
